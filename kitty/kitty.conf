# İsteğe bağlı: Arka plandaki masaüstünü/pencereleri bulanıklaştır (KDE/GNOME compositor desteğine bağlıdır)
background_blur 1

# Kitty başlangıç kabuğu
shell /usr/bin/fish

# Duvar kağıdının yolu
background_image /home/aalkiz/Downloads/28614.png

# Ekranı orantılı doldurması için
background_image_layout cscaled

# Resmin karartma oranı (0.85 - 0.95 arası kodların net okunmasını sağlar)
background_tint 0.95
